name: Checks
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Lint and build frontend
        working-directory: web
        run: |
          bun run lint
          bun run build
      - name: Embed frontend
        run: cp -R web/dist/. internal/web/dist/
      - name: Go checks
        run: |
          go vet ./...
          go test -race ./...
      - name: Verify Docker persistence and rollback
        env:
          JUSTDEPLOY_DOCKER_TESTS: '1'
        run: go test ./internal/adapter -run TestDockerIntegrationPersistenceAndRollback -count=1
      - name: Dependency audit
        run: |
          cd web
          bun audit
          cd ..
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build runtime image
        run: docker build -f docker/Dockerfile -t justdeploy-check:${{ github.sha }} .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: justdeploy-check:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
