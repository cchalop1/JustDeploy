name: Build and Release
concurrency: release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Verify application
        run: |
          cd web
          bun install --frozen-lockfile
          bun run lint
          bun audit
          bun run build
          cd ..
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go test -race ./...
      - name: Build application
        run: |
          make build-ci

      - name: Create zip file
        run: |
          zip justdeploy-linux-arm.zip bin/justdeploy-linux-arm
          zip justdeploy-linux-x86.zip bin/justdeploy-linux-x86
          zip justdeploy-darwin-arm.zip bin/justdeploy-darwin-arm
          zip justdeploy-darwin-x86.zip bin/justdeploy-darwin-x86

      - name: Release checksums
        run: sha256sum justdeploy-*.zip > SHA256SUMS
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SHA256SUMS
            justdeploy-linux-arm.zip
            justdeploy-linux-x86.zip
            justdeploy-darwin-arm.zip
            justdeploy-darwin-x86.zip

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract tag version
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image using script
        run: |
          cd docker
          chmod +x build-docker.sh
          ./build-docker.sh --ci
